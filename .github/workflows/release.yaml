name: Release
# Publishes to npm when package.json carries a version that is not on npm yet (push to main),
# or bumps and publishes on demand (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: Version bump
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Bump version (manual release)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          npm version ${{ inputs.release_type }} -m "chore(release): v%s [skip ci]"
      - name: Check whether this version is published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "health-components@$VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Test and build
        if: steps.check.outputs.publish == 'true'
        run: |
          npm run typecheck
          npm test
          npm run build
          npm run verify:package
      - name: Publish to npm
        if: steps.check.outputs.publish == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Push version tag
        if: steps.check.outputs.publish == 'true'
        run: |
          git tag -f "v${{ steps.check.outputs.version }}"
          git push origin HEAD:main --follow-tags || git push origin "v${{ steps.check.outputs.version }}"
      - name: GitHub release
        if: steps.check.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.check.outputs.version }}
          generate_release_notes: true
